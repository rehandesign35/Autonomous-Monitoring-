name: monitor-pricing-page
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MOCK_TARGET_URL: ${{ secrets.MOCK_TARGET_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Node version
        run: |
          echo "Node version being used:"
          node --version
          which node
      - name: Install agent dependencies
        working-directory: ./agent
        run: npm install
      - name: Install Playwright Chromium
        working-directory: ./agent
        run: npx playwright install --with-deps chromium
      - name: Run monitoring agent
        working-directory: ./agent
        run: npm run start
      - name: Enforce non-success failure policy
        if: ${{ failure() }}
        run: |
          echo "The monitoring run failed."
          exit 1